<div class="withdraw-form-container" style="max-width: 600px; margin: 30px auto; padding: 20px;">
  <div class="mb-4">
    <h2 class="m-0">Withdraw Funds</h2>
  </div>

  <div class="withdraw-form">
    @if(message) {
    <p class="success">{{ message }}</p>
    }
    @if(errorMessage) {
    <p class="error">{{ errorMessage }}</p>
    }
    <form (ngSubmit)="makeWithdrawal()">
      <div>
        <label for="accountNo">Account Number:</label>
        <input type="number" id="accountNo" [(ngModel)]="accountNo" name="accountNo" required />
      </div>

      <div>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" [(ngModel)]="amount" name="amount" required min="1" />
      </div>

      <div>
        <label for="description">Description:</label>
        <input type="text" id="description" [(ngModel)]="description" name="description" />
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Withdraw</button>
      </div>
    </form>
  </div>
</div>
