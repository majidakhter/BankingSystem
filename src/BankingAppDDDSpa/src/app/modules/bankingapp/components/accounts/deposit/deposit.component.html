<div class="deposit-form">
    <h2>Deposit Funds</h2>
    @if(message)
    {
       <p class="success">{{ message }}</p>
    }
    @if(errorMessage)
    {
       <p class="error">{{ errorMessage }}</p>
    }
    <form (ngSubmit)="makeDeposit()">
      <div>
        <label for="userId">User ID:</label>
        <input type="number" id="userId" [(ngModel)]="userId" name="userId" required />
      </div>
  
      <div>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" [(ngModel)]="amount" name="amount" required min="1" />
      </div>
  
      <div>
        <label for="description">Description:</label>
        <input type="text" id="description" [(ngModel)]="description" name="description" />
      </div>
  
      <button type="submit">Deposit</button>
    </form>
  </div>
