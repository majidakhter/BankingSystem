<div class="loan-payment-container">
    <h2>Loan Payment</h2>
    @if(errorMessage){
      <div class="error-message">{{ errorMessage }}</div>
    }
    @if(successMessage){
      <div class="success-message">{{ successMessage }}</div>
    }
    @if(loan){
      <div>
      <p><strong>Loan ID:</strong> {{ loan.id }}</p>
      <p><strong>Loan Amount:</strong> {{ loan.loanAmount | currency }}</p>
      <p><strong>Balance Remaining:</strong> {{ loan.balanceRemaining | currency }}</p>
      <p><strong>Monthly Payment:</strong> {{ loan.monthlyPayment | currency }}</p>
    </div>
    }  
    
  
    <div class="form-group">
      <label for="paymentAmount">Payment Amount:</label>
      <input type="number" id="paymentAmount" [(ngModel)]="paymentAmount" placeholder="Enter Payment Amount" />
    </div>
  
    <button (click)="makePayment()">Make Payment</button>
  </div>
