<div class="bills-recharges-wrapper">
  
  <!-- Top Blue Header Bar -->
  <div class="top-banner-bar py-4 px-4 text-white" style="background-color: #061c38;">
    <div class="container" style="max-width: 1140px;">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <h2 class="fw-bold m-0 text-white">Pay Bills</h2>
        
        <!-- Search Biller Bar -->
        <div class="search-biller-box position-relative" style="width: 320px;">
          <i class="bi bi-search position-absolute start-0 top-50 translate-middle-y ms-3 text-muted"></i>
          <input 
            type="text" 
            class="form-control rounded-pill pe-3 ps-5 border-0 shadow-sm" 
            placeholder="Search biller" 
            [(ngModel)]="searchBillerQuery" />
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Body -->
  <div class="py-4">
    <div class="container" style="max-width: 1140px;">
      
      <!-- Messages -->
      @if (errorMessage) {
        <div class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMessage }}
        </div>
      }
      @if (successMessage) {
        <div class="alert alert-success alert-dismissible fade show mb-4" role="alert">
          <i class="bi bi-check-circle-fill me-2"></i> {{ successMessage }}
        </div>
      }

      <div class="row g-4">
        
        <!-- LEFT MAIN CARD -->
        <div class="col-lg-8">
          
          <div class="card border-0 shadow-sm p-4 rounded-4 bg-white position-relative">
            <h4 class="fw-bold text-dark mb-4">Quick Recharge</h4>

            <div class="row align-items-center">
              
              <div class="col-md-8">
                
                <!-- Radio Option Category -->
                <div class="d-flex align-items-center gap-4 mb-4">
                  
                  <div class="form-check">
                    <input 
                      class="form-check-input" 
                      type="radio" 
                      name="rechargeCat" 
                      id="catMobile" 
                      value="MobilePrepaid" 
                      [checked]="rechargeCategory === 'MobilePrepaid'"
                      (change)="setCategory('MobilePrepaid')">
                    <label class="form-check-label fw-medium text-dark ms-1" for="catMobile">
                      Mobile Prepaid
                    </label>
                  </div>

                  <div class="form-check">
                    <input 
                      class="form-check-input" 
                      type="radio" 
                      name="rechargeCat" 
                      id="catFastag" 
                      value="FASTag" 
                      [checked]="rechargeCategory === 'FASTag'"
                      (change)="setCategory('FASTag')">
                    <label class="form-check-label fw-medium text-dark ms-1" for="catFastag">
                      FASTag
                    </label>
                  </div>

                  <div class="form-check">
                    <input 
                      class="form-check-input" 
                      type="radio" 
                      name="rechargeCat" 
                      id="catDth" 
                      value="DTH" 
                      [checked]="rechargeCategory === 'DTH'"
                      (change)="setCategory('DTH')">
                    <label class="form-check-label fw-medium text-dark ms-1" for="catDth">
                      DTH
                    </label>
                  </div>

                </div>

                <!-- Input Field & Action -->
                <div class="mb-4">
                  <label class="form-label text-dark small fw-semibold">
                    @if (rechargeCategory === 'MobilePrepaid') { Mobile Number }
                    @else if (rechargeCategory === 'FASTag') { Vehicle Number }
                    @else { Subscriber ID }
                  </label>
                  
                  <div class="row g-3 align-items-center">
                    <div class="col-md-7">
                      <input 
                        type="text" 
                        class="form-control custom-input" 
                        placeholder="Enter Mobile Number" 
                        [(ngModel)]="mobileNumber" />
                    </div>
                    <div class="col-md-5">
                      <button 
                        type="button" 
                        class="btn btn-outline-primary recharge-now-btn w-100 fw-semibold px-4 py-2" 
                        (click)="onRechargeNow()"
                        [disabled]="isLoading">
                        @if (isLoading) {
                          <span class="spinner-border spinner-border-sm me-1"></span>
                        }
                        Recharge Now
                      </button>
                    </div>
                  </div>
                </div>

              </div>

              <!-- Smartphone Illustration Side Graphic -->
              <div class="col-md-4 text-center d-none d-md-block">
                <div class="illustration-badge p-3 bg-light-blue rounded-4 d-inline-block">
                  <i class="bi bi-phone-vibrate text-primary display-4"></i>
                  <div class="mt-2">
                    <span class="badge bg-success rounded-pill px-3 py-1">Instant Activation</span>
                  </div>
                </div>
              </div>

            </div>

          </div>

        </div>

        <!-- RIGHT SIDEBAR: QUICK LINKS -->
        <div class="col-lg-4">
          
          <div class="card quick-links-card border-0 shadow-sm p-4 rounded-4 bg-white">
            <h4 class="fw-bold text-dark mb-4 fs-4">Quick Links</h4>
            
            <ul class="list-group list-group-flush border-0">
              
              <li class="list-group-item border-0 px-0 py-3 d-flex justify-content-between align-items-center cursor-pointer quick-link-item" (click)="setCategory('MobilePrepaid')">
                <span class="d-flex align-items-center gap-3 text-dark fw-medium">
                  <i class="bi bi-phone text-primary fs-5"></i> Mobile Prepaid Recharge
                </span>
                <i class="bi bi-chevron-right text-muted"></i>
              </li>

              <li class="list-group-item border-0 px-0 py-3 d-flex justify-content-between align-items-center cursor-pointer quick-link-item" (click)="setCategory('FASTag')">
                <span class="d-flex align-items-center gap-3 text-dark fw-medium">
                  <i class="bi bi-lightbulb text-primary fs-5"></i> Pay Electricity Bills
                </span>
                <i class="bi bi-chevron-right text-muted"></i>
              </li>

              <li class="list-group-item border-0 px-0 py-3 d-flex justify-content-between align-items-center cursor-pointer quick-link-item" (click)="navigateTo('/transfer')">
                <span class="d-flex align-items-center gap-3 text-dark fw-medium">
                  <i class="bi bi-credit-card-2-front text-primary fs-5"></i> Pay any Credit Card Bills
                </span>
                <i class="bi bi-chevron-right text-muted"></i>
              </li>

              <li class="list-group-item border-0 px-0 py-3 d-flex justify-content-between align-items-center cursor-pointer quick-link-item" (click)="navigateTo('/user-profile')">
                <span class="d-flex align-items-center gap-3 text-dark fw-medium">
                  <i class="bi bi-shield-plus text-primary fs-5"></i> Insurance Premium Payments
                </span>
                <i class="bi bi-chevron-right text-muted"></i>
              </li>

              <li class="list-group-item border-0 px-0 py-3 d-flex justify-content-between align-items-center cursor-pointer quick-link-item" (click)="navigateTo('/deposit')">
                <span class="d-flex align-items-center gap-3 text-dark fw-medium">
                  <i class="bi bi-person-check text-primary fs-5"></i> Set Mutual Fund SmartPay
                </span>
                <i class="bi bi-chevron-right text-muted"></i>
              </li>

            </ul>

          </div>

        </div>

      </div>

    </div>
  </div>

</div>
